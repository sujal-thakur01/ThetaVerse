name: Roadmap Validation

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * *'

jobs:
  validate-roadmap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-validation/roadmap
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run roadmap validation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python roadmap_eval.py --input sample_inputs.json --out runs --strict

      - name: Upload validation output
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-validation-results
          path: ai-validation/roadmap/runs
